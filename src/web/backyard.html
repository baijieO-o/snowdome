<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Snowdome 后院演示</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1620; color: #d7e2ee; font: 14px/1.5 "Microsoft YaHei", sans-serif; }
  #app { display: flex; height: 100%; }
  aside { width: 280px; padding: 16px; background: #13212e; border-right: 1px solid #1f3850; overflow-y: auto; }
  aside h1 { font-size: 18px; margin: 0 0 12px; color: #f2f6fa; }
  aside h2 { font-size: 13px; color: #8fa9c2; margin: 18px 0 6px; font-weight: normal; letter-spacing: 1px; }
  label { display: block; color: #8fa9c2; font-size: 12px; margin-bottom: 4px; }
  input[type=text], input[type=number] { width: 100%; padding: 6px 8px; background: #0d1620; color: #d7e2ee; border: 1px solid #1f3850; border-radius: 4px; }
  input[type=range] { width: 100%; }
  button { margin: 4px 4px 4px 0; padding: 6px 10px; background: #1d3347; color: #d7e2ee; border: 1px solid #2c4a66; border-radius: 4px; cursor: pointer; }
  button:hover { background: #24405a; }
  button.on { background: #3d6e8f; border-color: #6fa3c7; }
  .legend span { display: inline-block; width: 12px; height: 12px; margin: 0 4px 0 0; vertical-align: middle; border-radius: 2px; }
  .legend div { margin: 4px 0; font-size: 12px; color: #8fa9c2; }
  .tip { font-size: 12px; color: #8fa9c2; }
  #stage { flex: 1; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #info { position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; background: rgba(13,22,32,.85); border: 1px solid #1f3850; border-radius: 4px; font-size: 12px; }
  #layerLabel { font-size: 13px; color: #f2f6fa; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Snowdome 后院演示</h1>
    <div class="tip">本页是后院沙盒的本地演示，改动不会写入世界。</div>

    <h2>地形种子</h2>
    <label for="seed">种子（留空则随机）</label>
    <input id="seed" type="text" placeholder="例如 123">
    <div>
      <button id="apply">按种子生成</button>
      <button id="randomize">随机种子</button>
    </div>
    <div id="seedInfo" class="tip"></div>

    <h2>编辑模式</h2>
    <div>
      <button id="modeDig" class="on">挖掘</button>
      <button id="modePlace">放置</button>
      <button id="reset">清除改动</button>
    </div>

    <h2>高度层</h2>
    <div id="layerLabel"></div>
    <input id="layer" type="range" min="0" max="14" value="6">
    <div class="tip">拖动滑块切换层：向上看到悬空方块，向下看到地下。</div>

    <h2>图例</h2>
    <div class="legend">
      <div><span style="background:#4d8a5a"></span>草地（地表）</div>
      <div><span style="background:#8a6a45"></span>泥土层</div>
      <div><span style="background:#6f7880"></span>岩石层</div>
      <div><span style="background:#c9a55a"></span>玩家放置</div>
      <div><span style="background:#2b4a6a"></span>玩家挖空（显示为空）</div>
    </div>

    <h2>视角</h2>
    <div>
      <button id="rotL">↶ 左转</button>
      <button id="rotR">↷ 右转</button>
      <button id="resetView">重置视角</button>
    </div>

    <h2>操作</h2>
    <div class="tip">
      左键：按当前模式挖掘或放置当前层的格子。<br>
      拖动：平移视角。滚轮：缩放。<br>
      Q / E：旋转视角。R：重置视角。
    </div>
  </aside>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="info"></div>
  </div>
</div>
<script src="/backyard.js"></script>
</body>
</html>
